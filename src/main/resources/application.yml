spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/webox?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:webox}
    password: ${DB_PASSWORD:webox}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
server.error.include-message: always
spring.cache.caffeine.spec: maximumSize=100,expireAfterWrite=30s
webox:
  upload-dir: ${UPLOAD_DIR:./uploads}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT:25}
