services:
  app:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/webox?serverTimezone=UTC
      DB_USER: webox
      DB_PASSWORD: webox
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: webox
      MYSQL_USER: webox
      MYSQL_PASSWORD: webox
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["webox_mysql:/var/lib/mysql"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 3s, retries: 15}
volumes: {webox_mysql: {}}
